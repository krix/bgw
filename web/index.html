<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131b">
  <title>Bunguru WA</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <main>
    <header>
      <h1>Bunguru WA</h1>
      <p class="subtitle">Browser port of the native reconstruction</p>
    </header>
    <div class="screen">
      <canvas id="game" width="320" height="240" aria-label="Bunguru WA game screen"></canvas>
    </div>
    <p class="hint">
      Arrows move &middot; Space or Ctrl jumps &middot; Space/Z/X confirm
      &middot; Esc backs out
    </p>
    <div class="controls" aria-label="Touch controls">
      <button type="button" data-code="ArrowLeft" aria-label="Move left">&#9664;</button>
      <button type="button" data-code="ArrowRight" aria-label="Move right">&#9654;</button>
      <button type="button" data-code="Space" aria-label="Jump or confirm">JUMP</button>
      <button type="button" data-code="Escape" aria-label="Back or menu">MENU</button>
    </div>
    <p class="note">
      Assets are loaded from <code>../build/</code>, so run the bundled server
      from the repository root (<code>node web/server.mjs</code>) or open the
      site from the published repository root.
    </p>
    <noscript>This game needs JavaScript and Web Audio.</noscript>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
